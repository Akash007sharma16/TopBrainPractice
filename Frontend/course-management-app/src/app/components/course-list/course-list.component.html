<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>TITLE</th>
        <th>INSTRUCTOR</th>
        <th>DURATION</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @if (courses.length === 0) {
        <tr>
          <td colspan="5" class="empty">No courses found.</td>
        </tr>
      }
      @for (course of courses; track course.id) {
        <tr>
          <td>{{ course.id }}</td>
          <td>{{ course.title }}</td>
          <td>{{ course.instructor }}</td>
          <td>{{ course.duration }} hrs</td>
          <td class="actions">
            <button class="btn-icon edit" (click)="onEdit(course)" title="Edit">✏️</button>
            <button class="btn-icon delete" (click)="onDelete(course.id)" title="Delete">🗑️</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
