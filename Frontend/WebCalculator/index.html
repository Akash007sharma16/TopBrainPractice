<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js"></script>

</head>
<body>

    <div class="container mt-5">
        <div class="card shadow p-4 col-md-6 mx-auto">

            <h2 class="text-center mb-3">Simple Calculator</h2>
            <p class="text-center text-muted">Trainer: Mohd Salman</p>
            <p class="text-center text-muted">Candidate : Akashdeep Sharma</p>

            <!-- Input 1 -->
            <div class="mb-3">
                <label class="form-label">First Number</label>
                <input type="number" id="num1" class="form-control" placeholder="Enter first number">
            </div>

            <!-- Input 2 -->
            <div class="mb-3">
                <label class="form-label">Second Number</label>
                <input type="number" id="num2" class="form-control" placeholder="Enter second number">
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button class="btn btn-success" onclick="add()">Add</button>
                <button class="btn btn-primary" onclick="subtract()">Subtract</button>
                <button class="btn btn-warning" onclick="multiply()">Multiply</button>
                <button class="btn btn-danger" onclick="divide()">Divide</button>
            </div>

            <!-- Result -->
            <div class="mt-4 result-box" id="result">
                Calculated Result: --
            </div>

        </div>
    </div>



</body>
</html>
