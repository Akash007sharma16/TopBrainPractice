<div class="bg-primary text-white py-5">
  <div class="container text-center">
    <i class="bi bi-box-seam display-1 mb-3 d-block"></i>
    <h1 class="display-4 fw-bold">Welcome to OrderTracker</h1>
    <p class="lead mt-3">Track your orders in real-time. View status, pricing, and delivery updates all in one place.</p>
    <a routerLink="/orders" class="btn btn-light btn-lg mt-3">
      <i class="bi bi-list-ul me-2"></i>View Orders
    </a>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4 text-center">
    <div class="col-md-4">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body p-4">
          <i class="bi bi-clock-history text-warning display-5 mb-3 d-block"></i>
          <h5 class="card-title">Pending</h5>
          <p class="card-text text-muted">Orders that are being processed and awaiting shipment.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body p-4">
          <i class="bi bi-truck text-primary display-5 mb-3 d-block"></i>
          <h5 class="card-title">Shipped</h5>
          <p class="card-text text-muted">Orders on their way to your doorstep.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body p-4">
          <i class="bi bi-check-circle text-success display-5 mb-3 d-block"></i>
          <h5 class="card-title">Delivered</h5>
          <p class="card-text text-muted">Orders successfully delivered to you.</p>
        </div>
      </div>
    </div>
  </div>
</div>
