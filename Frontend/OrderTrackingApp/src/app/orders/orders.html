<div class="container py-5">
  <div class="d-flex align-items-center mb-4">
    <i class="bi bi-list-ul text-primary fs-2 me-3"></i>
    <div>
      <h2 class="mb-0 fw-bold">My Orders</h2>
      <small class="text-muted">{{ orders.length }} orders found</small>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-primary">
            <tr>
              <th scope="col">Order ID</th>
              <th scope="col">Product</th>
              <th scope="col">Price</th>
              <th scope="col">Date</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let order of orders">
              <td class="fw-semibold text-muted">{{ order.id }}</td>
              <td>
                <i class="bi bi-box me-2 text-secondary"></i>{{ order.name }}
              </td>
              <td class="fw-semibold">{{ order.price | currency:'INR':'symbol':'1.2-2' }}</td>
              <td>{{ order.date | date:'mediumDate' }}</td>
              <td>
                <span [ngClass]="{
                  'badge bg-warning text-dark': order.status === 1,
                  'badge bg-primary': order.status === 2,
                  'badge bg-success': order.status === 3,
                  'badge bg-secondary': order.status > 3
                }">
                  <i [ngClass]="{
                    'bi bi-clock me-1': order.status === 1,
                    'bi bi-truck me-1': order.status === 2,
                    'bi bi-check-circle me-1': order.status === 3
                  }"></i>
                  {{ order.status | orderStatus }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
